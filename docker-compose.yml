services:
  postgres:
    image: postgres:16-alpine
    container_name: enchente-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: enchente
      POSTGRES_USER: enchente
      POSTGRES_PASSWORD: enchente
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enchente -d enchente"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
